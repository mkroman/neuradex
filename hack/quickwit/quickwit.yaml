# Quickwit node configuration for the local neuradex stack.
#
# Version 0.7 is the node-config format used by Quickwit 0.8.x. The index config uses the
# 0.8 format (hack/quickwit/neuradex-events.yaml).
#
# All state lives under /quickwit/qwdata, which is a named volume in compose.yaml. This is a
# single-node, file-backed setup for local development only.

version: 0.7

node_id: neuradex-local

# Bind inside the container. The host port is published on 127.0.0.1 only.
listen_address: 0.0.0.0

rest:
  listen_port: 7280

grpc_listen_port: 7281

peer_seeds: []

data_dir: /quickwit/qwdata

# File-backed metastore and index root. Both are local paths, not S3.
metastore_uri: file:///quickwit/qwdata/indexes
default_index_root_uri: file:///quickwit/qwdata/indexes

# The local stack already has Jaeger; do not open Quickwit's own OTLP/Jaeger listeners.
indexer:
  enable_otlp_endpoint: false

jaeger:
  enable_endpoint: false
