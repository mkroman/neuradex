# Fixture and Kagi-mock server for the neuradex e2e suite.
#
# The service is configured with KAGI_BASE_URL=http://fixtures and
# KAGI_PRIVACY_PASS=false, so it uses session-cookie authentication against
# this server: GET /search?token=... returns the kagi_session cookie and
# GET /search?q=... returns the document holding the stream nonce.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Both the token request (no `q`) and the nonce document (`q`) use this
    # path. The cookie is added to every response because the client checks it
    # on the token response.
    location = /search {
        add_header Set-Cookie "kagi_session=test-session; Path=/" always;
        default_type text/html;
        try_files /search.html =404;
    }

    # The stock mime.types maps `bin` to application/octet-stream; override it
    # in this location so the fixture really serves an SSE stream.
    location = /socket/search {
        types {
            text/event-stream bin;
        }
        default_type text/event-stream;
        try_files /search_stream_sse.bin =404;
    }

    location = /page {
        default_type text/html;
        charset utf-8;
        try_files /page.html =404;
    }

    location = /redirect {
        return 302 /page;
    }

    # The stock mime.types maps `txt` to text/plain; override it in this
    # location so /v1/fetch exercises the unsupported-media-type path.
    location = /binary {
        types {
            application/octet-stream txt;
        }
        default_type application/octet-stream;
        try_files /binary.txt =404;
    }

    location / {
        return 404;
    }
}
