name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly audit of Cargo.lock against the RustSec advisory database.
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

# Keep the runs list readable for schedule/manual runs; PRs keep the PR title.
run-name: >-
  ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && format('Security audit · {0}', github.ref_name)
      || github.event.pull_request.title || github.event.head_commit.message || github.event_name }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

# Cancel superseded runs on the same ref to free runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo Deny
    # Advisory checks only: `cargo deny check advisories` is the blocking gate.
    # The licenses/bans/sources sections are not evaluated by this job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.8"
          install_args: "cargo-deny"
      - name: Install Rust toolchain
        # cargo deny shells out to `cargo metadata`, so cargo must be on PATH.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check advisories
        # Mirrors the replaced cargo-deny-action invocation, including its
        # input defaults (--log-level warn, --manifest-path, --all-features).
        run: cargo deny --log-level warn --manifest-path Cargo.toml --all-features check advisories
