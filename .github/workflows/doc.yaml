name: Rustdoc

on:
  workflow_call:
    inputs:
      runner:
        description: "The GitHub runner to use"
        default: "ubuntu-latest"
        type: string
      toolchain:
        description: "Rust toolchain to use. Defaults to `stable`."
        default: "stable"
        type: string
      cache-key:
        description: "Shared cache key"
        default: "ci-stable-doc"
        type: string
      upload:
        description: "Whether to upload the built documentation as an artifact"
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTDOCFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  doc:
    name: Documentation
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Install build dependencies
        # wreq compiles BoringSSL; bindgen needs libclang.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - name: Restore cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.cache-key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Doc builds all features (including kagi's native TLS), so it keeps its
      # own key instead of sharing the default-feature test cache.
      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Upload documentation
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc
          overwrite: true
