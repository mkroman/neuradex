name: Zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded scans on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  zizmor:
    name: Zizmor Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action defaults its token to github.token; this is enough for the
    # online audits.
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # SARIF mode (the default) does not fail on findings.
          advanced-security: false
