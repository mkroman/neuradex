# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Policy: `cargo deny check advisories` is the blocking gate in CI
# (.github/workflows/security.yaml); every other check is left at or below its
# default so a transitive oddity cannot block CI on its own. Config validation
# is not scoped to the requested check, so even keys of checks CI does not run
# must stay valid.

[graph]
# All targets are checked; nothing needs to be restricted here.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerability advisories are always errors (the field configuring them was
# removed in cargo-deny 0.16). Unmaintained is a scope, not a lint level:
# `none` keeps unmaintained advisories out of the gate entirely, while yanked
# crates only warn.
unmaintained = "none"
yanked = "warn"

[licenses]
# The usual permissive set (MPL-2.0 and CDLA-Permissive-2.0 come in via the
# `scraper` and `wreq` trees). Licenses outside this list are always denied
# when `cargo deny check licenses` runs, so extend it when a new transitive
# license appears.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are not published (publish = false); skip them.
ignore = true

[bans]
# Duplicates are reported but never deny: pinning this to "deny" would break
# CI on the first transitive duplicate.
multiple-versions = "warn"

[sources]
# Only crates.io and no git sources are allowed; anything else fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
