[package]
name = "neuradex"
version.workspace = true
edition.workspace = true
description = "A small API service implementing tools for LLM agents."
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["query"] }
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
html5ever = "0.40.0"
kagi = { path = "../kagi", default-features = false, features = ["rustls"] }
neuradex-docs = { path = "../neuradex-docs", optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url.workspace = true
# The derive macros come from the workspace table (utoipa 6.0.0 cannot compile without
# its `macros` feature); this entry only opts the service package into the dependency.
utoipa = { workspace = true, optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
wreq = { version = "0.16.1", default-features = false, features = [
    "tokio-rt",
    "webpki-roots",
    "prefix-symbols",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
wreq-util = "0.2.0"

[features]
default = ["docs"]
# The documentation page at /docs; implies OpenAPI generation (the page renders from it).
docs = ["utoipa", "dep:neuradex-docs"]
# OpenAPI document generation and the /openapi.json endpoint.
utoipa = ["dep:utoipa", "dep:utoipa-axum"]

[dev-dependencies]
serde_html_form = "0.4.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
