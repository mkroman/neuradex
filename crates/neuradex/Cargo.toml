[package]
name = "neuradex"
version.workspace = true
edition.workspace = true
description = "A small API service implementing tools for LLM agents."
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
axum-extra = { version = "0.12.6", default-features = false, features = ["query"] }
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
html5ever = "0.40.0"
kagi = { path = "../kagi", default-features = false, features = ["rustls"] }
neuradex-docs = { path = "../neuradex-docs", optional = true }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-resource-detectors.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry_sdk.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url.workspace = true
# utoipa 6.0.0 cannot compile without its `macros` feature; the service always uses the
# derives for its OpenAPI document.
utoipa.workspace = true
utoipa-axum = "0.3.0"
wreq.workspace = true
wreq-util = "0.2.0"

[features]
default = ["docs"]
# The documentation page at /docs; the OpenAPI document and /openapi.json are always built.
docs = ["dep:neuradex-docs"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support", features = ["app"] }
tower.workspace = true

[lints]
workspace = true
