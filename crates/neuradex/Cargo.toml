[package]
name = "neuradex"
version.workspace = true
edition.workspace = true
description = "A small API service implementing tools for LLM agents."
license.workspace = true
publish = false
# The shared benchmark helper lives next to the benchmark targets; it is a module, not a
# benchmark target of its own.
autobenches = false

[lib]
bench = false

[[bin]]
name = "neuradex"
path = "src/main.rs"
bench = false

[dependencies]
axum.workspace = true
axum-extra = { version = "0.12.6", default-features = false, features = ["query"] }
clap.workspace = true
futures = { version = "0.3.31", default-features = false, features = ["std"] }
html5ever = "0.40.0"
# The compression features also make reqwest advertise `Accept-Encoding` and decode
# compressed responses. A browser-impersonating client must send that header; without
# it Kagi sees a non-browser request, and a compressed body would not be decoded.
kagi = { path = "../kagi", default-features = false, features = [
    "rustls",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
neuradex-audit = { path = "../neuradex-audit" }
neuradex-content = { path = "../neuradex-content", features = ["s3"] }
neuradex-docs = { path = "../neuradex-docs", optional = true }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-resource-detectors.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry_sdk.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url.workspace = true
# utoipa 6.0.0 cannot compile without its `macros` feature; the service always uses the
# derives for its OpenAPI document.
utoipa.workspace = true
utoipa-axum = "0.3.0"
wreq.workspace = true
wreq-util = "0.2.0"

[features]
default = ["docs"]
# The documentation page at /docs; the OpenAPI document and /openapi.json are always built.
docs = ["dep:neuradex-docs"]

[dev-dependencies]
assert_cmd.workspace = true
criterion.workspace = true
neuradex-packfile = { path = "../neuradex-packfile" }
predicates.workspace = true
scraper.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support", features = ["app"] }
tower.workspace = true

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "http-stack"
harness = false

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
