[package]
name = "test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared HTTP test harnesses for the neuradex workspace."
publish = false

[features]
default = []
# The Kagi client harness; keeps the service and its HTTP stack out of client-level tests.
client = [
    "dep:base64",
    "dep:httpmock",
    "dep:kagi",
    "dep:rand",
    "dep:sha2",
    "dep:url",
    "dep:voprf",
]
# The full-service harness, including the Kagi client harness.
app = [
    "client",
    "dep:axum",
    "dep:neuradex",
    "dep:serde_json",
    "dep:tower",
]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
httpmock = { workspace = true, optional = true }
# Keep the test client on the same transport features the service uses: the
# compression features also make reqwest advertise `Accept-Encoding`.
kagi = { path = "../kagi", default-features = false, features = [
    "rustls",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
], optional = true }
neuradex = { path = "../neuradex", default-features = false, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
url = { workspace = true, optional = true }
voprf = { workspace = true, optional = true }

[lints]
workspace = true
