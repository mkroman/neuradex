[package]
name = "neuradex-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The neuradex documentation page: askama templates, theme sources, and runtime CSS bundling from an OpenAPI document."

[dependencies]
askama = "0.16.1"
htmlize.workspace = true
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
# Macro-free utoipa: only the OpenAPI object model (`utoipa::openapi::OpenApi`), no
# proc-macro stack. Must move in lockstep with the service crate's utoipa version.
utoipa = { workspace = true }

[lints]
workspace = true
