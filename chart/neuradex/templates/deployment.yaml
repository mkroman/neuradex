{{- $fullname := include "neuradex.fullname" . -}}
{{- include "neuradex.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "neuradex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $annotations := dict }}
      {{- if not .Values.existingSecret }}
      {{- $_ := set $annotations "checksum/secret" (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) }}
      {{- end }}
      {{- if and .Values.audit.hmacKey (not .Values.audit.existingSecret) }}
      {{- $_ := set $annotations "checksum/audit-secret" (include (print $.Template.BasePath "/audit-secret.yaml") . | sha256sum) }}
      {{- end }}
      {{- if and (eq .Values.content.store "s3") (not .Values.content.s3.existingSecret) .Values.content.s3.accessKeyId .Values.content.s3.secretAccessKey }}
      {{- $_ := set $annotations "checksum/content-secret" (include (print $.Template.BasePath "/content-secret.yaml") . | sha256sum) }}
      {{- end }}
      {{- range $key, $value := .Values.podAnnotations }}
      {{- $_ := set $annotations $key $value }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neuradex.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neuradex.serviceAccountName" . }}
      # Belt and braces: also enforced on the ServiceAccount itself.
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: neuradex
          image: {{ include "neuradex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:{{ .Values.containerPort }}
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- if .Values.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otelExporterOtlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.otelResourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otelResourceAttributes | quote }}
            {{- end }}
            {{- if .Values.userAgent }}
            - name: USER_AGENT
              value: {{ .Values.userAgent | quote }}
            {{- end }}
            - name: KAGI_PRIVACY_PASS
              value: {{ .Values.privacyPass | quote }}
            - name: KAGI_MAX_SESSIONS
              value: {{ .Values.kagiMaxSessions | quote }}
            - name: KAGI_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default $fullname }}
                  key: {{ .Values.kagiSessionTokenKey }}
            {{- with .Values.audit.logPath }}
            - name: AUDIT_LOG_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.audit.existingSecret .Values.audit.hmacKey }}
            - name: AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.audit.existingSecret | default (include "neuradex.auditSecretName" .) }}
                  key: {{ .Values.audit.hmacKeyKey }}
            {{- end }}
            - name: CONTENT_STORE
              value: {{ .Values.content.store | quote }}
            {{- if eq .Values.content.store "local" }}
            - name: CONTENT_LOCAL_PATH
              value: {{ .Values.content.local.path | quote }}
            {{- end }}
            {{- if eq .Values.content.store "s3" }}
            - name: CONTENT_S3_ENDPOINT
              value: {{ .Values.content.s3.endpoint | quote }}
            - name: CONTENT_S3_REGION
              value: {{ .Values.content.s3.region | quote }}
            - name: CONTENT_S3_BUCKET
              value: {{ .Values.content.s3.bucket | quote }}
            {{- with .Values.content.s3.prefix }}
            - name: CONTENT_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: CONTENT_S3_FORCE_PATH_STYLE
              value: {{ .Values.content.s3.forcePathStyle | quote }}
            - name: CONTENT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.content.s3.existingSecret | default (include "neuradex.contentSecretName" .) }}
                  key: {{ .Values.content.s3.accessKeyIdKey }}
            - name: CONTENT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.content.s3.existingSecret | default (include "neuradex.contentSecretName" .) }}
                  key: {{ .Values.content.s3.secretAccessKeyKey }}
            {{- end }}
            - name: CONTENT_PACK_TARGET_BYTES
              value: {{ .Values.content.packTargetBytes | int64 | quote }}
            - name: CONTENT_MAX_PACK_AGE_SECS
              value: {{ .Values.content.maxPackAgeSecs | int64 | quote }}
            - name: CONTENT_MAX_BODY_BYTES
              value: {{ .Values.content.maxBodyBytes | int64 | quote }}
            - name: CONTENT_RETENTION_DAYS
              value: {{ .Values.content.retentionDays | int64 | quote }}
            - name: CONTENT_COMPRESSION_LEVEL
              value: {{ .Values.content.compressionLevel | int64 | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable scratch space for libraries that want /tmp; the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.content.store "local" }}
            - name: content
              mountPath: {{ .Values.content.local.path | quote }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.content.store "local" }}
        - name: content
          {{- if .Values.content.local.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "neuradex.contentClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
