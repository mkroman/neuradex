{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neuradex.serviceAccountName" . }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod never talks to the Kubernetes API; do not mount a token.
automountServiceAccountToken: false
{{- end }}
