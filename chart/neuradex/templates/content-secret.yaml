{{- if and (eq .Values.content.store "s3") (not .Values.content.s3.existingSecret) .Values.content.s3.accessKeyId .Values.content.s3.secretAccessKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neuradex.contentSecretName" . }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.content.s3.accessKeyIdKey }}: {{ .Values.content.s3.accessKeyId | quote }}
  {{ .Values.content.s3.secretAccessKeyKey }}: {{ .Values.content.s3.secretAccessKey | quote }}
{{- end }}
