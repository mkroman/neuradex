{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "neuradex.fullname" . }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      {{- include "neuradex.selectorLabels" . | nindent 6 }}
  ingress:
    # Any source may reach the API (it is a public JSON service); the
    # sensitive direction is egress, which is restricted below.
    - ports:
        - port: http
          protocol: TCP
  egress:
    # DNS resolution (kube-dns/CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The service fetches arbitrary URLs (http/https) and talks to Kagi over TLS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
{{- end }}
