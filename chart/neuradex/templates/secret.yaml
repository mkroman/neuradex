{{- if not .Values.existingSecret -}}
{{- if not .Values.kagiSessionToken -}}
{{- fail "either existingSecret or kagiSessionToken must be set (KAGI_SESSION_TOKEN is required by the service)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neuradex.fullname" . }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.kagiSessionTokenKey }}: {{ required "kagiSessionToken must not be empty" .Values.kagiSessionToken | quote }}
{{- end }}
