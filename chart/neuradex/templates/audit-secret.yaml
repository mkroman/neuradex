{{- if and .Values.audit.hmacKey (not .Values.audit.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neuradex.auditSecretName" . }}
  labels:
    {{- include "neuradex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.audit.hmacKeyKey }}: {{ required "audit.hmacKey must not be empty when the chart manages the Secret; set audit.existingSecret instead" .Values.audit.hmacKey | quote }}
{{- end }}
