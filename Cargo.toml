[workspace]
resolver = "3"
# The glob matches directories, not manifests: every direct child of crates/
# must be a package. Add a non-package directory under crates/ to `exclude`.
members = ["crates/*"]
# Root commands target the service package; pass --workspace to cover every member.
default-members = ["crates/neuradex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
htmlize = { version = "1.1.0", features = ["unescape"] }
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "query"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tracing = "0.1.41"
url = "2.5.8"
# The OpenAPI object model with the `macros` feature (utoipa's only default feature).
# `default-features = false` pins us to exactly this set, but `macros` itself is not
# optional: utoipa 6.0.0 cannot compile without it — `openapi::schema` references the
# macros-gated internal `crate::utoipa` module — so no member can use it truly
# macro-free. Re-check whether `macros` can be dropped again on version bumps.
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
cognitive_complexity = { level = "allow", priority = 1 }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = 1 }
trivial_casts = { level = "warn", priority = 1 }
trivial_numeric_casts = { level = "warn", priority = 1 }
unused_import_braces = { level = "warn", priority = 1 }
unused_qualifications = { level = "warn", priority = 1 }
