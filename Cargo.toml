[workspace]
resolver = "3"
# The glob matches directories, not manifests: every direct child of crates/
# must be a package. Add a non-package directory under crates/ to `exclude`.
members = ["crates/*"]
# Root commands target the service package; pass --workspace to cover every member.
default-members = ["crates/neuradex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
assert_cmd = "2.2.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
base64 = "0.23.0"
blake3 = "1.8"
criterion = { version = "0.8.2", features = ["async_tokio"] }
hmac = "0.12"
htmlize = { version = "1.1.0", features = ["unescape"] }
http = "1"
httpmock = "0.9.0"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
opentelemetry-resource-detectors = "0.13.0"
opentelemetry-semantic-conventions = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
predicates = "3.1.4"
# Matches the rand_core 0.10 line required by voprf 0.6.
rand = "0.10.3"
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "query"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
thiserror = "2.0"
tempfile = "3.27.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
url = "2.5.8"
# Kagi's Privacy Pass tokens use the Ristretto255/SHA-512 VOPRF ciphersuite. voprf 0.6 keeps
# the RFC 9497 wire format while moving to elliptic-curve 0.14 / crypto-bigint 0.7.
voprf = { version = "0.6.0-pre.2", default-features = false, features = ["ristretto255-ciphersuite", "std"] }
# The OpenAPI object model and derives. `default-features = false` pins us to exactly this
# set, but `macros` itself is not optional: utoipa 6.0.0 cannot compile without it —
# `openapi::schema` references the macros-gated internal `crate::utoipa` module.
# Re-check whether `macros` can be dropped again on version bumps.
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
# state.rs hard-codes the matching `Accept-Encoding` value; keep this compression set in sync.
wreq = { version = "0.16.1", default-features = false, features = [
    "tokio-rt",
    "webpki-roots",
    "prefix-symbols",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
cognitive_complexity = { level = "allow", priority = 1 }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = 1 }
trivial_casts = { level = "warn", priority = 1 }
trivial_numeric_casts = { level = "warn", priority = 1 }
unused_import_braces = { level = "warn", priority = 1 }
unused_qualifications = { level = "warn", priority = 1 }
