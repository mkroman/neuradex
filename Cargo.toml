[workspace]
resolver = "3"
members = ["crates/kagi", "crates/neuradex-docs"]

[workspace.dependencies]
htmlize = { version = "1.1.0", features = ["unescape"] }
regex = "1.12.2"
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "json", "query"] }
scraper = "0.27.0"
secrecy = "0.10.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
] }
tracing = "0.1.41"
url = "2.5.8"
# The OpenAPI object model with the `macros` feature (utoipa's only default feature).
# `default-features = false` pins us to exactly this set, but `macros` itself is not
# optional: utoipa 6.0.0 cannot compile without it — `openapi::schema` references the
# macros-gated internal `crate::utoipa` module — so no member can use it truly
# macro-free. Re-check whether `macros` can be dropped again on version bumps.
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }

[package]
name = "neuradex"
version = "0.1.0"
edition = "2024"
description = "A small API service implementing tools for LLM agents."
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["query"] }
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
html5ever = "0.39.0"
kagi = { path = "crates/kagi", default-features = false, features = ["rustls"] }
neuradex-docs = { path = "crates/neuradex-docs", optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url.workspace = true
# The derive macros come from the workspace table (utoipa 6.0.0 cannot compile without
# its `macros` feature); this entry only opts the root package into the dependency.
utoipa = { workspace = true, optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
wreq = { version = "0.16.1", default-features = false, features = [
    "tokio-rt",
    "webpki-roots",
    "prefix-symbols",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
wreq-util = "0.2.0"

[features]
default = ["docs"]
# The documentation page at /docs; implies OpenAPI generation (the page renders from it).
docs = ["utoipa", "dep:neuradex-docs"]
# OpenAPI document generation and the /openapi.json endpoint.
utoipa = ["dep:utoipa", "dep:utoipa-axum"]

[dev-dependencies]
serde_html_form = "0.2.7"
tower = { version = "0.5.2", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
cognitive_complexity = { level = "allow", priority = 1 }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = 1 }
trivial_casts = { level = "warn", priority = 1 }
trivial_numeric_casts = { level = "warn", priority = 1 }
unused_import_braces = { level = "warn", priority = 1 }
unused_qualifications = { level = "warn", priority = 1 }
