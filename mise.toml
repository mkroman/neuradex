# Keep this in step with the mise-action `version` inputs and renovate.json's
# `constraints.mise`; they select the CLI that reads this lockfile.
min_version = "2026.10.19"

[settings]
lockfile = true
minimum_release_age = "7d"
# Resolve checksums from the forge/registry itself, not mise's metadata mirror.
# Versions are pinned exactly, so the version-list cache buys nothing here.
use_versions_host = false

# Keep the short names in [tools] and in the workflow install_args. Without
# these aliases, mise's registry selects the aqua backend for these names.
# Renovate resolves the short names through its own registry data; `mise lock`
# applies these aliases when it refreshes the lockfile.
[tool_alias]
cargo-deny = "github:EmbarkStudios/cargo-deny"
shellcheck = "github:koalaman/shellcheck"
kind = "github:kubernetes-sigs/kind"
helm = "github:helm/helm"

[tools]
cargo-deny = "0.20.2"
shellcheck = "0.11.0"
kind = "0.33.0"

# Helm publishes only signature assets on GitHub, not installable archives.
# The alias keeps GitHub as the version source; the archive comes from the
# official get.helm.sh mirror and is verified against mise.lock.
[tools.helm]
version = "4.3.1"
[tools.helm.platforms]
linux-x64 = { url = "https://get.helm.sh/helm-v{{ version }}-linux-amd64.tar.gz" }
macos-arm64 = { url = "https://get.helm.sh/helm-v{{ version }}-darwin-arm64.tar.gz" }

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.clippy]
run = "cargo clippy --all-targets --workspace --locked -- -D warnings"

[tasks.test]
run = "cargo test --workspace --locked"

[tasks.test-lean]
run = "cargo test -p neuradex --no-default-features --locked"

[tasks.doc]
run = "cargo doc --workspace --no-deps --all-features --locked"
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.deny]
run = "cargo deny --log-level warn --manifest-path Cargo.toml --all-features check advisories"

[tasks.shellcheck]
run = "shellcheck hack/*.sh"

[tasks.check]
run = [
  "mise run fmt",
  "mise run clippy",
  "mise run test",
  "mise run test-lean",
  "mise run doc",
  "mise run deny",
  "mise run shellcheck",
]
