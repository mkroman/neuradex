# Production audit event pipeline for neuradex.
#
# This is a values file for the upstream Vector Helm chart. It uses the chart's native
# `customConfig` extension point: the chart creates the ConfigMap, DaemonSet, ServiceAccount,
# and RBAC, while this file owns the audit filter and sink configuration.
#
#   kubectl -n neuradex create secret generic neuradex-clickhouse \
#     --from-literal=clickhouse-password=...
#   kubectl -n neuradex create secret generic neuradex-events \
#     --from-literal=access-key-id=... --from-literal=secret-access-key=...
#   helm repo add vector https://helm.vector.dev
#   helm upgrade --install vector vector/vector -n neuradex \
#     -f deploy/event-pipeline/values.yaml
#
# Adjust `serviceSelector`, the endpoints, and the archive bucket for the cluster. Credentials
# come from the referenced Secrets; do not inline them here.

role: Agent
serviceSelector: app.kubernetes.io/name=neuradex,app.kubernetes.io/instance=neuradex
image:
  repository: docker.io/timberio/vector
  tag: 0.61.0-debian
service:
  enabled: false
serviceHeadless:
  enabled: false
quickwit:
  endpoint: http://quickwit:7280
  index: neuradex-events
clickhouse:
  endpoint: http://clickhouse:8123
  database: neuradex
  table: events
  user: neuradex
archive:
  endpoint: https://s3.us-west-004.backblazeb2.com
  region: us-west-004
  bucket: neuradex-events
  prefix: events
env:
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: neuradex-clickhouse
        key: clickhouse-password
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: neuradex-events
        key: access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: neuradex-events
        key: secret-access-key
podLabels:
  app.kubernetes.io/part-of: neuradex
  app.kubernetes.io/component: event-pipeline
tolerations:
  - operator: Exists
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
customConfig:
  data_dir: /var/lib/vector
  sources:
    neuradex_logs:
      type: kubernetes_logs
      extra_label_selector: '{{ .Values.serviceSelector }}'
      read_from: beginning
      max_line_bytes: 1048576
  transforms:
    parse_json:
      type: remap
      inputs: [neuradex_logs]
      drop_on_error: true
      source: |
        . = parse_json!(.message)
    audit_events:
      type: filter
      inputs: [parse_json]
      condition: '.event == "neuradex.request"'
    shape_quickwit:
      type: remap
      inputs: [audit_events]
      source: |
        if is_array(.content_references) {
          .content_references = {"items": .content_references}
        }
        if exists(.operation.top_hosts) && is_array(.operation.top_hosts) {
          .operation.top_hosts = {"items": .operation.top_hosts}
        }
    flatten:
      type: remap
      inputs: [audit_events]
      source: |
        .service_name = to_string(.service.name) ?? ""
        .service_version = to_string(.service.version) ?? ""
        .service_environment = to_string(.service.environment) ?? ""
        .http_method = to_string(.http.method) ?? ""
        .http_route = to_string(.http.route) ?? ""
        .http_path = to_string(.http.path) ?? ""
        .http_status = to_int(.http.status) ?? 0
        .http_request_body_bytes = to_int(.http.request_body_bytes) ?? 0
        .http_response_body_bytes = to_int(.http.response_body_bytes) ?? 0
        .http_duration_ms = to_int(.http.duration_ms) ?? 0
        .operation_type = to_string(.operation.type) ?? ""
        .query_length = to_int(.operation.query_length) ?? 0
        .query_terms = to_int(.operation.query_terms) ?? 0
        .query_sha256 = to_string(.operation.query_sha256) ?? ""
        .query_limit = to_int(.operation.limit) ?? 0
        .query_count = to_int(.operation.count) ?? 0
        .auth_mode = to_string(.operation.auth_mode) ?? ""
        .queue_ms = to_int(.operation.queue_ms) ?? 0
        .upstream_ms = to_int(.operation.upstream_ms) ?? 0
        .upstream_result_count = to_int(.operation.upstream_result_count) ?? 0
        .returned_result_count = to_int(.operation.returned_result_count) ?? 0
        .zero_results = to_bool(.operation.zero_results) ?? false
        .result_digest = to_string(.operation.result_digest) ?? ""
        .top_hosts = if exists(.operation.top_hosts) { encode_json(.operation.top_hosts) } else { "[]" }
        .target_scheme = to_string(.operation.target_scheme) ?? ""
        .target_host = to_string(.operation.target_host) ?? ""
        .target_port = to_int(.operation.target_port) ?? 0
        .target_path = to_string(.operation.target_path) ?? ""
        .target_url_sha256 = to_string(.operation.target_url_sha256) ?? ""
        .redirects = to_int(.operation.redirects) ?? 0
        .final_host = to_string(.operation.final_host) ?? ""
        .upstream_status = to_int(.operation.upstream_status) ?? 0
        .content_type = to_string(.operation.content_type) ?? ""
        .content_length = to_int(.operation.content_length) ?? 0
        .bytes_read = to_int(.operation.bytes_read) ?? 0
        .ttfb_ms = to_int(.operation.ttfb_ms) ?? 0
        .total_ms = to_int(.operation.total_ms) ?? 0
        .truncated = to_bool(.operation.truncated) ?? false
        .stopped_at_head = to_bool(.operation.stopped_at_head) ?? false
        .infrastructure_kind = to_string(.operation.kind) ?? ""
        .content_reference_count = 0
        .content_bytes = 0
        .content_storage = ""
        .content_key = ""
        .content_blake3 = ""
        .content_sha256 = ""
        .refs = if is_array(.content_references) { .content_references } else { [] }
        .refs = array!(.refs)
        .content_reference_count = length(.refs)
        for_each(.refs) -> |_index, ref| {
          .content_bytes = .content_bytes + (to_int(ref.size) ?? 0)
        }
        if .content_reference_count > 0 {
          .content_storage = to_string(.refs[0].storage) ?? ""
          .content_key = to_string(.refs[0].key) ?? ""
          .content_blake3 = to_string(.refs[0].blake3) ?? ""
          .content_sha256 = to_string(.refs[0].sha256) ?? ""
        }
        .content_references = encode_json(.refs)
        .request_headers = if exists(.request_headers) { encode_json(.request_headers) } else { "{}" }
        .response_headers = if exists(.response_headers) { encode_json(.response_headers) } else { "{}" }
        del(.service)
        del(.http)
        del(.operation)
        del(.refs)
  sinks:
    quickwit:
      type: http
      inputs: [shape_quickwit]
      uri: '{{ trimSuffix "/" .Values.quickwit.endpoint }}/api/v1/{{ .Values.quickwit.index }}/ingest?commit=auto'
      method: post
      encoding:
        codec: json
      framing:
        method: newline_delimited
      request:
        headers:
          Content-Type: application/x-ndjson
      batch:
        max_events: 1000
        timeout_secs: 5
      buffer:
        type: disk
        max_size: 268435488
        when_full: block
      healthcheck:
        enabled: false
    clickhouse:
      type: clickhouse
      inputs: [flatten]
      endpoint: '{{ trimSuffix "/" .Values.clickhouse.endpoint }}'
      database: '{{ .Values.clickhouse.database }}'
      table: '{{ .Values.clickhouse.table }}'
      format: json_each_row
      skip_unknown_fields: true
      date_time_best_effort: true
      auth:
        strategy: basic
        user: '{{ .Values.clickhouse.user }}'
        password: "${CLICKHOUSE_PASSWORD}"
      batch:
        max_events: 1000
        timeout_secs: 5
      buffer:
        type: disk
        max_size: 268435488
        when_full: block
    archive:
      type: aws_s3
      inputs: [audit_events]
      bucket: '{{ .Values.archive.bucket }}'
      region: '{{ .Values.archive.region }}'
      endpoint: '{{ trimSuffix "/" .Values.archive.endpoint }}'
      force_path_style: true
      compression: zstd
      encoding:
        codec: json
      framing:
        method: newline_delimited
      key_prefix: '{{ trimSuffix "/" .Values.archive.prefix }}/'
      filename_time_format: "%Y-%m-%dT%H"
      batch:
        timeout_secs: 3600
      buffer:
        type: disk
        max_size: 268435488
        when_full: block
